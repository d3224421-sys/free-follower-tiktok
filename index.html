<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YOU ARE AN IDIOT</title>
<style>
body{margin:0;background:#fff;height:100vh;overflow:hidden;font-family:'Courier New',monospace;}
@keyframes shake{0%{transform:translate(0,0);}25%{transform:translate(-3px,3px);}50%{transform:translate(3px,-3px);}75%{transform:translate(-2px,-2px);}100%{transform:translate(2px,2px);}}
.popup{position:fixed;border:2px solid #000;padding:10px 14px;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.25);width:240px;font-size:12px;z-index:9999;animation:shake 0.3s infinite;}
.close{position:absolute;top:4px;right:10px;cursor:pointer;font-weight:bold;font-size:18px;color:#000;}
.close:hover{transform:scale(1.2);}
.title{font-size:14px;font-weight:bold;margin-bottom:6px;letter-spacing:1px;text-transform:uppercase;color:#000;}
.msg{font-size:11px;line-height:1.5;color:#333;}
.center-text{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:64px;color:#000;font-weight:bold;z-index:5;letter-spacing:6px;pointer-events:none;opacity:0.08;}
.webcam{position:fixed;top:15px;left:15px;width:280px;height:210px;background:#000;border:3px solid #000;box-shadow:0 4px 15px rgba(0,0,0,0.3);z-index:99999;overflow:hidden;}
.webcam video{width:100%;height:100%;object-fit:cover;}
.webcam::before{content:"LIVE";position:absolute;top:8px;right:8px;background:#ff0000;color:#fff;padding:2px 8px;font-size:9px;font-weight:bold;letter-spacing:1px;z-index:2;}
.webcam::after{content:"●";position:absolute;top:10px;right:50px;color:#ff0000;font-size:14px;animation:blink 1s infinite;z-index:2;}
@keyframes blink{0%{opacity:1;}50%{opacity:0;}100%{opacity:1;}}
.cam-label{position:absolute;bottom:6px;left:8px;color:#fff;font-size:9px;z-index:2;text-shadow:1px 1px 2px #000;}
.cam-status{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#fff;font-size:11px;z-index:1;text-align:center;}
</style>
</head>
<body>
<div class="center-text">HACKED</div>
<div class="webcam" id="camBox">
<div class="cam-status" id="camStatus">Requesting camera access...</div>
<video id="camVideo" autoplay playsinline></video>
<div class="cam-label">Front Camera Active</div>
</div>
<script>
const video=document.getElementById('camVideo');
const status=document.getElementById('camStatus');
navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false})
.then(function(stream){
video.srcObject=stream;
status.style.display='none';
})
.catch(function(err){
status.textContent='Camera access denied';
console.log('Camera error:',err);
});
function makePopup(){
const p=document.createElement("div");
p.className="popup";
let maxX=window.innerWidth-260;
let maxY=window.innerHeight-120;
if(maxX<0)maxX=0;
if(maxY<0)maxY=0;
let x,y;
let attempts=0;
do{
x=Math.random()*maxX;
y=Math.random()*maxY;
attempts++;
}while((x<320&&y<240)&&attempts<15);
p.style.left=x+"px";
p.style.top=y+"px";
p.innerHTML='<div class="close">×</div><div class="title">YOU ARE AN IDIOT!</div><div class="msg">HACKED BY MALIK AND HACK7RBGG</div>';
document.body.appendChild(p);
p.querySelector(".close").onclick=function(){
p.style.animation="shake 0.1s infinite";
setTimeout(()=>p.remove(),300);
};
setTimeout(()=>{if(p.parentNode)p.remove();},4500);
}
setInterval(makePopup,350);
setTimeout(()=>{
setInterval(makePopup,280);
},6000);
document.addEventListener("click",function(e){
for(let i=0;i<3;i++){
setTimeout(makePopup,i*120);
}
});
</script>
</body>
</html>
